
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tryzn Store - Google Sheets Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f8fafc;
      color: #1e293b;
    }

    h1 {
      margin-bottom: 8px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #1e293b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    pre {
      margin-top: 20px;
      padding: 18px;
      border-radius: 8px;
      background: #e2e8f0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }
  </style>
</head>

<body>
  <h1>Tryzn Store</h1>
  <p>Google Sheets API connection test</p>

  <button id="testButton">Test Connection</button>

  <pre id="result">Click the button to test your connection.</pre>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzoJJ-w-pUIg5_RBcl0X_asVmm2fQOsz8Z16jNRCSyKZVPmecvbZtXQ_52QI1kvHlBg/exec";

    const testButton = document.getElementById("testButton");
    const output = document.getElementById("result");

    testButton.addEventListener("click", async function () {
      testButton.disabled = true;
      output.textContent = "Connecting to Google Sheets...";

      try {
        const response = await fetch(
          API_URL + "?action=products",
          {
            method: "GET",
            redirect: "follow"
          }
        );

        if (!response.ok) {
          throw new Error("HTTP status: " + response.status);
        }

        const responseText = await response.text();

        let data;

        try {
          data = JSON.parse(responseText);
        } catch {
          throw new Error(
            "The API did not return valid JSON:\n" +
            responseText.slice(0, 1000)
          );
        }

        output.textContent =
          "CONNECTED SUCCESSFULLY\n\n" +
          "FULL API RESPONSE:\n\n" +
          JSON.stringify(data, null, 2);

        console.log("Tryzn API response:", data);

      } catch (error) {
        output.textContent =
          "CONNECTION FAILED\n\n" +
          error.message +
          "\n\nOpen browser Developer Tools (F12) → Console for details.";

        console.error("Tryzn API error:", error);

      } finally {
        testButton.disabled = false;
      }
    });
  </script>
</body>
</html>
